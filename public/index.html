<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數獨 Sudoku - Pro (對戰版)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #14171f;
    --bg-soft: #1b1f2a;
    --bg-soft-2: #21273a;
    --paper: #fbf7ed;
    --paper-line: #e4dcc8;
    --ink: #23262b;
    --ink-soft: #6b6558;
    --gold: #d8a73d;
    --gold-soft: #e9c876;
    --teal: #2e8b84;
    --teal-soft: #7fc2bc;
    --red: #c1494d;
    --border-thick: #23262b;
    --note-color: #7b8393;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(216,167,61,0.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(46,139,132,0.09), transparent 50%);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::after {
    content: ""; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.045; mix-blend-mode: overlay; pointer-events: none; z-index: 1;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 20px 60px; position: relative; z-index: 2; }

  header { text-align: center; margin-bottom: 34px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 12px; }
  .eyebrow::before, .eyebrow::after { content: "—"; color: rgba(233,200,118,0.4); margin: 0 10px; }

  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 54px; margin: 0; letter-spacing: 0.02em; color: var(--paper); }
  h1 .accent { color: var(--teal-soft); font-style: italic; font-weight: 600; }

  .subtitle { margin-top: 12px; font-size: 13px; color: #8b93a3; letter-spacing: 0.03em; }
  #online-status { margin-top: 10px; font-size: 12px; font-weight: 600; color: #7b8393; }

  /* 主選單（單機 / 線上對戰 兩區塊） */
  #home-screen { text-align: center; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; max-width: 900px; margin: 30px auto 0; align-items: stretch; }
  .mode-card {
    background: var(--bg-soft); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 30px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 14px;
  }
  .mode-card h2 { font-family: 'Fraunces', serif; margin: 0; color: var(--gold-soft); font-size: 22px; }
  .mode-card p { font-size: 12px; color: #8b93a3; margin: 0; line-height: 1.6; min-height: 36px; }
  .mode-card .mode-btn {
    background: var(--teal); border: none; padding: 13px; font-size: 15px; font-weight: 600;
    border-radius: 4px; cursor: pointer; color: var(--paper); width: 100%; margin-top: auto;
  }
  .mode-divider { margin: 16px 0; color: #6b6558; font-size: 13px; }
  .lobby-group { margin: 10px 0; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .lobby-group input {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.2); color: var(--paper);
    padding: 12px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; text-align: center;
  }
  .lobby-group input:focus { outline: 2px solid var(--teal-soft); }

  /* 難度按鈕（線上對戰用 與 單機用 共用樣式） */
  .difficulty-section { width: 100%; margin: 4px 0 10px; text-align: left; }
  .difficulty-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 10px; }
  .difficulty-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .difficulty-btn {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.15); color: #9aa2b3;
    padding: 10px 4px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; width: 100%; margin: 0;
    display: flex; flex-direction: column; gap: 3px; align-items: center;
  }
  .difficulty-btn .diff-sub { font-size: 10px; font-weight: 400; color: #6f7788; }
  .difficulty-btn:hover:not(:disabled) { border-color: var(--teal-soft); color: var(--teal-soft); }
  .difficulty-btn.selected { background: var(--teal); border-color: var(--teal); color: var(--paper); box-shadow: 0 0 0 2px rgba(127,194,188,0.35); }
  .difficulty-btn.selected .diff-sub { color: rgba(251,247,237,0.75); }
  .difficulty-btn.locked, .difficulty-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #btn-create-room:disabled { opacity: 0.35; cursor: not-allowed; }

  /* 遊戲主介面預設隱藏 */
  #game-container, #solo-screen { display: none; }

  .layout { display: flex; gap: 32px; align-items: flex-start; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .back-link { background: none; border: none; color: #8b93a3; font-size: 12px; cursor: pointer; padding: 4px 0; margin-bottom: 8px; }
  .back-link:hover { color: var(--gold-soft); }

  .board-card {
    background: var(--paper); border-radius: 6px; padding: 22px;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04); position: relative;
  }
  .board-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--paper-line); border-radius: 3px; pointer-events: none; }

  #board, #solo-board {
    display: grid; grid-template-columns: repeat(9, 44px); grid-template-rows: repeat(9, 44px);
    gap: 0; border: 2.5px solid var(--border-thick); background: var(--border-thick); user-select: none;
  }

  .cell {
    background: var(--paper); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500; color: var(--teal); cursor: pointer; position: relative; transition: background 0.1s ease;
  }
  .cell .notes-grid { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
  .cell .note-number { font-size: 10px; color: var(--note-color); display: flex; align-items: center; justify-content: center; line-height: 1; }
  .cell.given { color: var(--ink); font-weight: 600; cursor: default; }

  .cell:nth-child(3n) { border-right: 2px solid var(--border-thick); }
  .cell:nth-child(9n) { border-right: none; }
  #board .cell:nth-child(n+19):nth-child(-n+27),
  #board .cell:nth-child(n+46):nth-child(-n+54),
  #solo-board .cell:nth-child(n+19):nth-child(-n+27),
  #solo-board .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border-thick); }

  .cell:not(.given):not(.error):hover { background: #f1ead6; }
  .cell.selected { background: #f4e6b8; box-shadow: inset 0 0 0 2.5px var(--teal); z-index: 5; }
  .cell.peer { background: #f7f1de; }
  .cell.same-value:not(.selected) { background: #ecdfae; }
  .cell.error { color: var(--red); background: #f6dede; }

  .shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  .panel { width: 250px; display: flex; flex-direction: column; gap: 18px; }
  .panel-block {
    background: linear-gradient(180deg, var(--bg-soft-2), var(--bg-soft));
    border: 1px solid rgba(255,255,255,0.07); border-radius: 6px; padding: 16px 18px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,0.7);
  }

  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-soft); }

  button {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; border: 1px solid rgba(255,255,255,0.12);
    background: transparent; color: var(--paper); padding: 9px 10px; border-radius: 4px; cursor: pointer;
    transition: all 0.15s ease; width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 5px;
  }
  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-soft); background: rgba(255,255,255,0.02); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .numpad button { padding: 10px 0; font-size: 16px; font-weight: 500; width: auto; margin: 0; }

  .action-buttons button { text-align: left; padding: 12px; justify-content: flex-start; font-size: 14px; }
  .action-buttons button .k { color: var(--teal-soft); margin-right: 8px; font-weight: 600; width: 1.2em; text-align: center; }

  .timer-display { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; text-align: center; color: var(--paper); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .timer-display.warning { color: var(--red); }

  /* 彈跳視窗 */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,17,0.92); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s ease;
  }
  .overlay.show { display: flex; opacity: 1; }
  .end-card {
    background: var(--paper); color: var(--ink); padding: 40px 50px; border-radius: 8px; text-align: center;
    max-width: 400px; box-shadow: 0 40px 90px -20px rgba(0,0,0,0.8);
  }
  .end-card h2 { font-family: 'Fraunces', serif; font-size: 38px; margin: 0 0 10px; }
  .end-card p { color: var(--ink-soft); font-size: 15px; margin: 0 0 25px; line-height: 1.6; }
  .end-card .end-actions { display: flex; flex-direction: column; gap: 10px; }
  .end-card button.primary {
    background: var(--teal); color: var(--paper); border: none; padding: 12px 24px; font-weight: 600; font-size: 15px; width: 100%; border-radius: 4px; cursor: pointer; margin: 0;
  }
  .end-card button.primary:hover { background: #226b65; }
  .end-card button.secondary {
    background: transparent; color: var(--ink-soft); border: 1px solid #d8d2bf; padding: 12px 24px; font-size: 14px; width: 100%; border-radius: 4px; cursor: pointer; margin: 0;
  }

  @media (max-width: 850px) {
    .wrap { padding: 30px 15px; }
    #board, #solo-board { grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(9, 36px); }
    .cell { font-size: 17px; }
    .panel { width: 100%; max-width: 400px; margin: 0 auto; }
    .mode-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<input type="text" id="mobile-input" inputmode="numeric" style="position: absolute; top: -1000px; left: -1000px; opacity: 0; pointer-events: none;">

<!-- 主選單畫面：單機 / 線上對戰 -->
<div class="wrap" id="home-screen">
  <div class="eyebrow">數獨小遊戲</div>
  <h1>數<span class="accent">獨</span> 對決</h1>
  <div id="online-status">🟡 連線伺服器中...</div>

  <div class="mode-grid">
    <!-- 單機挑戰 -->
    <div class="mode-card">
      <h2>單機挑戰</h2>
      <p>自己與時間賽跑，簡單、中等、困難依序解鎖，挑戰完成時間！</p>
      <button class="mode-btn" id="btn-enter-solo">開始單機模式</button>
    </div>

    <!-- 線上對戰 -->
    <div class="mode-card">
      <h2>1v1 線上對戰</h2>
      <p>與朋友即時競速，先解開者獲勝！</p>

      <div class="difficulty-section">
        <div class="difficulty-label">請先選擇難度</div>
        <div class="difficulty-group" id="difficulty-group">
          <button type="button" class="difficulty-btn" data-diff="easy"><span>簡單</span></button>
          <button type="button" class="difficulty-btn" data-diff="medium"><span>中等</span></button>
          <button type="button" class="difficulty-btn" data-diff="hard"><span>困難</span></button>
        </div>
      </div>

      <div class="lobby-group">
        <button class="mode-btn" id="btn-create-room" disabled>建立新房間</button>
      </div>

      <div class="mode-divider">— 或者 —</div>

      <div class="lobby-group">
        <input type="text" id="input-room-id" placeholder="請輸入 4 碼房號">
        <button id="btn-join-room" style="background: var(--bg-soft-2); border: 1px solid var(--teal-soft); padding: 12px; font-size: 15px; color: var(--teal-soft);">加入房間</button>
      </div>
    </div>
  </div>
</div>

<!-- 單機模式畫面 -->
<div class="wrap" id="solo-screen">
  <button class="back-link" id="btn-back-home">← 返回主選單</button>
  <header>
    <div class="eyebrow">單機挑戰</div>
    <h1>數<span class="accent">獨</span> 修行</h1>
    <div class="subtitle" id="solo-status">選擇難度開始挑戰！完成簡單解鎖中等，完成中等解鎖困難。</div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div id="solo-board"></div>
    </div>

    <div class="panel">
      <div class="panel-block numpad-block">
        <div class="panel-header">
          <div class="panel-label">數字鍵盤</div>
          <button id="solo-btn-note" style="width:auto; padding:4px 8px; font-size:11px;">✎ 筆記</button>
        </div>
        <div class="numpad" id="solo-numpad"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 10px;">選擇難度</div>
        <div class="difficulty-group" id="solo-difficulty-group">
          <button type="button" class="difficulty-btn" data-diff="easy"><span>簡單</span></button>
          <button type="button" class="difficulty-btn locked" data-diff="medium" disabled><span>中等</span></button>
          <button type="button" class="difficulty-btn locked" data-diff="hard" disabled><span>困難</span></button>
        </div>
      </div>

      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 10px;">剩餘時間</div>
        <div class="timer-display" id="solo-timer">--:--</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 14px;">動作</div>
        <div class="action-buttons">
          <button id="solo-btn-check"><span class="k">✓</span>檢查盤面</button>
          <button id="solo-btn-erase"><span class="k">⌫</span>清除格子</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 遊戲主畫面 (線上對戰，預設隱藏) -->
<div class="wrap" id="game-container">
  <header>
    <div class="eyebrow" id="room-info-label">房間代碼: ----</div>
    <h1>數<span class="accent">獨</span> 競技</h1>
    <div class="subtitle" id="game-status">等待對手加入中...</div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="panel-block numpad-block">
        <div class="panel-header">
          <div class="panel-label">數字鍵盤</div>
          <button id="btn-note" style="width:auto; padding:4px 8px; font-size:11px;">✎ 筆記</button>
        </div>
        <div class="numpad" id="numpad"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">對戰即時戰況</div>
        <div style="margin-top: 10px; font-size: 13px; line-height: 1.6;">
          <div>我的進度: <span id="my-progress" style="color: var(--teal-soft); font-weight:600;">0%</span></div>
          <div>對手進度: <span id="opponent-progress" style="color: var(--gold-soft); font-weight:600;">0%</span></div>
          <div>對手錯誤: <span id="opponent-mistakes" style="color: var(--red);">0</span> 次</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 14px;">動作</div>
        <div class="action-buttons">
          <button id="btn-check"><span class="k">✓</span>檢查盤面</button>
          <button id="btn-erase"><span class="k">⌫</span>清除格子</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 遊戲結束/勝負結算彈窗 (線上對戰) -->
<div id="result-overlay" class="overlay">
  <div class="end-card">
    <h2 id="result-title">對戰結束</h2>
    <p id="result-desc">恭喜你獲得勝利！</p>
    <button id="result-close" class="primary">返回大廳</button>
  </div>
</div>

<!-- 單機模式通用彈窗 (提醒 / 過關 / 時間到) -->
<div id="solo-dialog-overlay" class="overlay">
  <div class="end-card">
    <h2 id="solo-dialog-title">提醒</h2>
    <p id="solo-dialog-desc"></p>
    <div class="end-actions" id="solo-dialog-actions"></div>
  </div>
</div>

<!-- Socket.io 前端套件 -->
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let currentRoomId = null;
let selectedDifficulty = null; // 'easy' | 'medium' | 'hard'（線上對戰用）
const DIFFICULTY_LABELS = { easy: '簡單', medium: '中等', hard: '困難' };
const SIZE = 9, BOX = 3;

let state = {
  puzzle: null, solution: null, board: null,
  notes: null, selected: null, mistakes: 0,
  started: false, won: false, gameOver: false, notesMode: false
};

const els = {
  homeScreen: document.getElementById('home-screen'),
  gameContainer: document.getElementById('game-container'),
  soloScreen: document.getElementById('solo-screen'),
  onlineStatus: document.getElementById('online-status'),
  roomInfoLabel: document.getElementById('room-info-label'),
  gameStatus: document.getElementById('game-status'),
  board: document.getElementById('board'),
  numpad: document.getElementById('numpad'),
  myProgress: document.getElementById('my-progress'),
  opponentProgress: document.getElementById('opponent-progress'),
  opponentMistakes: document.getElementById('opponent-mistakes'),
  resultOverlay: document.getElementById('result-overlay'),
  resultTitle: document.getElementById('result-title'),
  resultDesc: document.getElementById('result-desc'),
  resultClose: document.getElementById('result-close'),
  difficultyGroup: document.getElementById('difficulty-group'),
  btnCreateRoom: document.getElementById('btn-create-room')
};

// --- 連線狀態監聽 ---
socket.on('connect', () => {
  els.onlineStatus.textContent = '🟢 已連線至對戰伺服器';
  els.onlineStatus.style.color = 'var(--teal-soft)';
});

socket.on('disconnect', () => {
  els.onlineStatus.textContent = '🔴 與伺服器斷線';
  els.onlineStatus.style.color = 'var(--red)';
});

// 房間建立成功或加入成功
socket.on('room_joined', (data) => {
  currentRoomId = data.roomId;
  els.homeScreen.style.display = 'none';
  els.gameContainer.style.display = 'block';
  const diffLabel = DIFFICULTY_LABELS[data.difficulty] || '中等';
  els.roomInfoLabel.textContent = `房間代碼: ${currentRoomId}｜難度: ${diffLabel}`;
  els.gameStatus.textContent = '等待對手加入房間中...';
  buildBoardDOM();
  buildNumpad();
});

// 房號錯誤提示
socket.on('error_msg', (msg) => {
  alert(msg);
});

// 雙人到齊，伺服器派發題目開始對戰
socket.on('start_game', (data) => {
  const { puzzle, solution, difficulty } = data;
  loadGame(puzzle, solution);
  const diffLabel = DIFFICULTY_LABELS[difficulty] || '中等';
  els.roomInfoLabel.textContent = `房間代碼: ${currentRoomId}｜難度: ${diffLabel}`;
  els.gameStatus.textContent = '⚔️ 雙人競速對戰開始！先解開者獲勝！';
  els.gameStatus.style.color = 'var(--gold-soft)';
  state.started = true;
});

// 接收對手的進度更新
socket.on('opponent_update', (data) => {
  els.opponentProgress.textContent = `${data.progress}%`;
  els.opponentMistakes.textContent = data.mistakes;
});

// 接收對戰勝負結果 (含對手斷線判斷)
socket.on('game_over', (data) => {
  state.gameOver = true;

  if (data.winner === socket.id) {
    els.resultTitle.textContent = "勝利！🎉";
    els.resultTitle.style.color = "var(--teal)";
    if (data.reason === 'opponent_disconnected') {
      els.resultDesc.textContent = "對手退出畫面，您已獲勝！";
    } else {
      els.resultDesc.textContent = "太神啦！你比對手更快完成數獨！";
    }
  } else {
    els.resultTitle.textContent = "落敗... 😢";
    els.resultTitle.style.color = "var(--red)";

// --- 共用工具 ---
function emptyBoard() { return Array.from({length: SIZE}, () => Array(SIZE).fill(0)); }
function emptyNotesBoard() { return Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => new Set())); }

function buildCellsInto(containerEl, onClickHandler) {
  containerEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `${containerEl.id}-${r}-${c}`;

      const notesGrid = document.createElement('div');
      notesGrid.className = 'notes-grid';
      for (let i = 1; i <= 9; i++) {
        const noteNum = document.createElement('span');
        noteNum.className = `note-number note-${i}`;
        notesGrid.appendChild(noteNum);
      }
      cell.appendChild(notesGrid);

      const valSpan = document.createElement('span');
      valSpan.className = 'cell-value';
      cell.appendChild(valSpan);

      cell.addEventListener('click', (e) => { e.stopPropagation(); onClickHandler(r, c); });
      containerEl.appendChild(cell);
    }
  }
}

function buildNumpadInto(containerEl, onClickHandler) {
  containerEl.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', (e) => { e.stopPropagation(); onClickHandler(n); });
    containerEl.appendChild(b);
  }
}

/* =========================================================
   線上對戰模式
   ========================================================= */

function loadGame(puzzle, solution) {
  state = {
    puzzle, solution, board: puzzle.map(row => row.slice()),
    notes: emptyNotesBoard(), selected: null, mistakes: 0,
    started: true, won: false, gameOver: false, notesMode: false
  };
  render();
  updateMyProgress();
}

function buildBoardDOM() { buildCellsInto(els.board, selectCell); }
function buildNumpad() { buildNumpadInto(els.numpad, inputNumber); }

function selectCell(r, c) {
  if (state.won || state.gameOver || !state.started) return;
  state.selected = [r, c];
  render();
  const mobileInput = document.getElementById('mobile-input');
  if (mobileInput) { mobileInput.value = ''; mobileInput.focus(); }
}

document.addEventListener('click', () => {
  if (els.gameContainer.style.display === 'block' && state.selected) { state.selected = null; render(); }
});

function inputNumber(num) {
  if (state.won || state.gameOver || !state.selected || !state.started) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return;

  if (state.notesMode) {
    const cellNotes = state.notes[r][c];
    if (cellNotes.has(num)) cellNotes.delete(num);
    else cellNotes.add(num);
  } else {
    state.board[r][c] = num;
    state.notes[r][c].clear();

    const cellEl = getCellEl(r, c);
    cellEl.classList.remove('error');

    if (num !== state.solution[r][c]) {
      state.mistakes++;
      cellEl.classList.add('error', 'shake');
      setTimeout(() => cellEl.classList.remove('shake'), 350);
    } else {
      checkWinCondition();
    }
    updateMyProgress();
  }
  render();
}

function eraseCell() {
  if (state.won || state.gameOver || !state.selected || !state.started) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return;

  if (state.notesMode) {
    state.notes[r][c].clear();
  } else {
    state.board[r][c] = 0;
    getCellEl(r, c).classList.remove('error');
    updateMyProgress();
  }
  render();
}

function updateMyProgress() {
  let totalEmpties = 0;
  let correctFilled = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (state.puzzle[r][c] === 0) {
        totalEmpties++;
        if (state.board[r][c] === state.solution[r][c]) correctFilled++;
      }
    }
  }
  const progress = totalEmpties === 0 ? 100 : Math.floor((correctFilled / totalEmpties) * 100);
  els.myProgress.textContent = `${progress}%`;
  socket.emit('update_progress', { roomId: currentRoomId, progress, mistakes: state.mistakes });
}

function checkWinCondition() {
  const filled = state.board.every((row, r) => row.every((v, c) => v === state.solution[r][c]));
  if (filled && !state.won) {
    state.won = true;
    socket.emit('win_game', { roomId: currentRoomId });
  }
}

function render() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cellEl = getCellEl(r, c);
      const valSpan = cellEl.querySelector('.cell-value');
      const notesGrid = cellEl.querySelector('.notes-grid');
      const v = state.board[r][c];
      const given = state.puzzle[r][c] !== 0;

      if (v !== 0) {
        valSpan.textContent = v;
        notesGrid.style.display = 'none';
        valSpan.style.display = 'block';
      } else {
        valSpan.textContent = '';
        valSpan.style.display = 'none';
        const cellNotes = state.notes[r][c];
        if (cellNotes.size > 0) {
          notesGrid.style.display = 'grid';
          for (let i = 1; i <= 9; i++) {
            const noteEl = notesGrid.querySelector(`.note-${i}`);
            noteEl.textContent = cellNotes.has(i) ? i : '';
          }
        } else {
          notesGrid.style.display = 'none';
        }
      }

      cellEl.classList.toggle('given', given);
      cellEl.classList.remove('selected', 'peer', 'same-value');

      if (state.selected) {
        const [sr, sc] = state.selected;
        const sameRow = r === sr, sameCol = c === sc;
        const sameBox = Math.floor(r / BOX) === Math.floor(sr / BOX) && Math.floor(c / BOX) === Math.floor(sc / BOX);
        if (sameRow && sameCol) cellEl.classList.add('selected');
        else if (sameRow || sameCol || sameBox) cellEl.classList.add('peer');
        const selVal = state.board[sr][sc];
        if (selVal !== 0 && v === selVal) cellEl.classList.add('same-value');
      }
    }
  }
}

function getCellEl(r, c) { return document.getElementById(`board-${r}-${c}`); }

document.getElementById('btn-note').addEventListener('click', (e) => {
  e.stopPropagation();
  state.notesMode = !state.notesMode;
  document.getElementById('btn-note').style.borderColor = state.notesMode ? 'var(--gold)' : '';
});

document.getElementById('btn-erase').addEventListener('click', (e) => { e.stopPropagation(); eraseCell(); });
document.getElementById('btn-check').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!state.started || state.gameOver) return;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = state.board[r][c];
      if (v !== 0 && v !== state.solution[r][c]) getCellEl(r, c).classList.add('error');
    }
  }
});

els.resultClose.addEventListener('click', () => { location.reload(); });

document.addEventListener('keydown', (e) => {
  if (els.gameContainer.style.display !== 'block') return;
  if (e.key === 'Shift') { state.notesMode = !state.notesMode; return; }
  if (!state.selected || state.gameOver || !state.started) return;
  let [r, c] = state.selected;

  if (e.key >= '1' && e.key <= '9') {
    inputNumber(parseInt(e.key, 10));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key === 'ArrowUp') r = (r - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowDown') r = (r + 1) % SIZE;
    else if (e.key === 'ArrowLeft') c = (c - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowRight') c = (c + 1) % SIZE;
    selectCell(r, c);
  }
});

/* =========================================================
   單機模式
   ========================================================= */

// --- 題目產生器（瀏覽器端自行運算，不需要伺服器） ---
function isValidSolo(board, row, col, num) {
  for (let i = 0; i < 9; i++) if (board[row][i] === num || board[i][col] === num) return false;
  const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
  for (let r = br; r < br + 3; r++) for (let c = bc; c < bc + 3; c++) if (board[r][c] === num) return false;
  return true;
}
function findEmptySolo(board) {
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (board[r][c] === 0) return [r, c];
  return null;
}
function solveSolo(board) {
  const empty = findEmptySolo(board);
  if (!empty) return true;
  const [row, col] = empty;
  let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
  for (const num of nums) {
    if (isValidSolo(board, row, col, num)) {
      board[row][col] = num;
      if (solveSolo(board)) return true;
      board[row][col] = 0;
    }
  }
  return false;
}
const SOLO_REMOVE_COUNT = { easy: 36, medium: 46, hard: 54 };
function generateClientPuzzle(difficulty) {
  const removeCount = SOLO_REMOVE_COUNT[difficulty] || SOLO_REMOVE_COUNT.medium;
  const solution = emptyBoard();
  solveSolo(solution);
  const puzzle = solution.map(row => row.slice());
  let removed = 0;
  while (removed < removeCount) {
    const r = Math.floor(Math.random() * 9);
    const c = Math.floor(Math.random() * 9);
    if (puzzle[r][c] !== 0) { puzzle[r][c] = 0; removed++; }
  }
  return { puzzle, solution };
}

const SOLO_TIME_LIMITS = { easy: 360, medium: 660, hard: 1200 }; // 6 / 11 / 20 分鐘
const SOLO_DIFF_LABELS = { easy: '簡單', medium: '中等', hard: '困難' };
const INACTIVITY_LIMIT_MS = 20000;

let soloState = null;
let soloTimerInterval = null;
let soloInactivityTimer = null;
let soloBoardBuilt = false;

const soloEls = {
  board: document.getElementById('solo-board'),
  numpad: document.getElementById('solo-numpad'),
  difficultyGroup: document.getElementById('solo-difficulty-group'),
  timer: document.getElementById('solo-timer'),
  status: document.getElementById('solo-status'),
  dialogOverlay: document.getElementById('solo-dialog-overlay'),
  dialogTitle: document.getElementById('solo-dialog-title'),
  dialogDesc: document.getElementById('solo-dialog-desc'),
  dialogActions: document.getElementById('solo-dialog-actions')
};

function getSoloProgress() {
  try {
    return JSON.parse(localStorage.getItem('sudoku_solo_progress')) || { easyDone: false, mediumDone: false };
  } catch (e) {
    return { easyDone: false, mediumDone: false };
  }
}
function setSoloProgress(p) { localStorage.setItem('sudoku_solo_progress', JSON.stringify(p)); }

function refreshSoloDifficultyButtons() {
  const progress = getSoloProgress();
  const defs = [
    { diff: 'easy', locked: false, sub: `限時 ${SOLO_TIME_LIMITS.easy / 60} 分鐘` },
    { diff: 'medium', locked: !progress.easyDone, sub: progress.easyDone ? `限時 ${SOLO_TIME_LIMITS.medium / 60} 分鐘` : '需先完成簡單' },
    { diff: 'hard', locked: !progress.mediumDone, sub: progress.mediumDone ? `限時 ${SOLO_TIME_LIMITS.hard / 60} 分鐘` : '需先完成中等' }
  ];
  defs.forEach(d => {
    const btn = soloEls.difficultyGroup.querySelector(`[data-diff="${d.diff}"]`);
    btn.disabled = d.locked;
    btn.classList.toggle('locked', d.locked);
    btn.innerHTML = `<span>${SOLO_DIFF_LABELS[d.diff]}${d.locked ? ' 🔒' : ''}</span><span class="diff-sub">${d.sub}</span>`;
  });
}

soloEls.difficultyGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.difficulty-btn');
  if (!btn || btn.disabled) return;
  startSoloLevel(btn.dataset.diff);
});

function ensureSoloBoardBuilt() {
  if (soloBoardBuilt) return;
  buildCellsInto(soloEls.board, soloSelectCell);
  buildNumpadInto(soloEls.numpad, soloInputNumber);
  soloBoardBuilt = true;
}

function stopSoloTimers() {
  if (soloTimerInterval) { clearInterval(soloTimerInterval); soloTimerInterval = null; }
  if (soloInactivityTimer) { clearTimeout(soloInactivityTimer); soloInactivityTimer = null; }
}

function startSoloLevel(difficulty) {
  stopSoloTimers();
  closeSoloDialog();
  const { puzzle, solution } = generateClientPuzzle(difficulty);
  soloState = {
    puzzle, solution, board: puzzle.map(r => r.slice()),
    notes: emptyNotesBoard(), selected: null, notesMode: false,
    difficulty, timeLeft: SOLO_TIME_LIMITS[difficulty],
    started: true, over: false, hasInteracted: false
  };
  soloEls.difficultyGroup.querySelectorAll('.difficulty-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.diff === difficulty);
  });
  soloEls.status.textContent = `⏱️ ${SOLO_DIFF_LABELS[difficulty]}模式挑戰開始！請在時間內完成。`;
  soloEls.status.style.color = 'var(--gold-soft)';
  soloRender();
  updateSoloTimerDisplay();
  soloTimerInterval = setInterval(() => {
    if (soloState.over) return;
    soloState.timeLeft--;
    updateSoloTimerDisplay();
    if (soloState.timeLeft <= 0) {
      clearInterval(soloTimerInterval);
      handleSoloTimeUp();
    }
  }, 1000);
  soloInactivityTimer = setTimeout(() => {
    if (soloState && !soloState.over && !soloState.hasInteracted) {
      showSoloDialog('提醒', '還想全部看完才開始填阿？', [
        { label: '好，我要開始了', primary: true, action: () => {} }
      ]);
    }
  }, INACTIVITY_LIMIT_MS);
}

function updateSoloTimerDisplay() {
  const t = Math.max(0, soloState ? soloState.timeLeft : 0);
  const m = String(Math.floor(t / 60)).padStart(2, '0');
  const s = String(t % 60).padStart(2, '0');
  soloEls.timer.textContent = `${m}:${s}`;
  soloEls.timer.classList.toggle('warning', t <= 30);
}

function soloSelectCell(r, c) {
  if (!soloState || soloState.over) return;
  soloState.selected = [r, c];
  soloRender();
}

function soloInputNumber(num) {
  if (!soloState || soloState.over || !soloState.selected) return;
  const [r, c] = soloState.selected;
  if (soloState.puzzle[r][c] !== 0) return;

  if (soloState.notesMode) {
    const cellNotes = soloState.notes[r][c];
    if (cellNotes.has(num)) cellNotes.delete(num);
    else cellNotes.add(num);
  } else {
    soloState.board[r][c] = num;
    soloState.notes[r][c].clear();
    soloState.hasInteracted = true;

    const cellEl = document.getElementById(`solo-board-${r}-${c}`);
    cellEl.classList.remove('error');
    if (num !== soloState.solution[r][c]) {
      cellEl.classList.add('error', 'shake');
      setTimeout(() => cellEl.classList.remove('shake'), 350);
    } else {
      checkSoloWin();
    }
  }
  soloRender();
}

function soloEraseCell() {
  if (!soloState || soloState.over || !soloState.selected) return;
  const [r, c] = soloState.selected;
  if (soloState.puzzle[r][c] !== 0) return;
  if (soloState.notesMode) {
    soloState.notes[r][c].clear();
  } else {
    soloState.board[r][c] = 0;
    document.getElementById(`solo-board-${r}-${c}`).classList.remove('error');
  }
  soloRender();
}

function checkSoloWin() {
  const filled = soloState.board.every((row, r) => row.every((v, c) => v === soloState.solution[r][c]));
  if (!filled || soloState.over) return;
  soloState.over = true;
  stopSoloTimers();

  const progress = getSoloProgress();
  if (soloState.difficulty === 'easy') progress.easyDone = true;
  if (soloState.difficulty === 'medium') progress.mediumDone = true;
  setSoloProgress(progress);
  refreshSoloDifficultyButtons();

  const used = SOLO_TIME_LIMITS[soloState.difficulty] - soloState.timeLeft;
  const mm = String(Math.floor(used / 60)).padStart(2, '0');
  const ss = String(used % 60).padStart(2, '0');

  const nextDiff = soloState.difficulty === 'easy' ? 'medium' : (soloState.difficulty === 'medium' ? 'hard' : null);
  const actions = [];
  if (nextDiff) {
    actions.push({ label: `挑戰${SOLO_DIFF_LABELS[nextDiff]}`, primary: true, action: () => startSoloLevel(nextDiff) });
  }
  actions.push({ label: '返回難度選擇', primary: !nextDiff, action: () => resetSoloBoard() });

  showSoloDialog('挑戰成功！🎉', `用時 ${mm}:${ss}，完成${SOLO_DIFF_LABELS[soloState.difficulty]}難度！`, actions);
}

function handleSoloTimeUp() {
  if (!soloState || soloState.over) return;
  soloState.over = true;
  stopSoloTimers();
  const diff = soloState.difficulty;
  showSoloDialog('時間到！', '尚未在時間內完成，要不要再試一次？', [
    { label: '再試一次', primary: true, action: () => startSoloLevel(diff) },
    { label: '返回難度選擇', primary: false, action: () => resetSoloBoard() }
  ]);
}

function resetSoloBoard() {
  soloState = null;
  stopSoloTimers();
  soloEls.timer.textContent = '--:--';
  soloEls.timer.classList.remove('warning');
  soloEls.status.textContent = '選擇難度開始挑戰！完成簡單解鎖中等，完成中等解鎖困難。';
  soloEls.status.style.color = '';
  soloEls.difficultyGroup.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('selected'));
  ensureSoloBoardBuilt();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cellEl = document.getElementById(`solo-board-${r}-${c}`);
      cellEl.querySelector('.cell-value').textContent = '';
      cellEl.querySelector('.notes-grid').style.display = 'none';
      cellEl.className = 'cell';
    }
  }
}

function soloRender() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cellEl = document.getElementById(`solo-board-${r}-${c}`);
      const valSpan = cellEl.querySelector('.cell-value');
      const notesGrid = cellEl.querySelector('.notes-grid');
      const v = soloState.board[r][c];
      const given = soloState.puzzle[r][c] !== 0;

      if (v !== 0) {
        valSpan.textContent = v;
        notesGrid.style.display = 'none';
        valSpan.style.display = 'block';
      } else {
        valSpan.textContent = '';
        valSpan.style.display = 'none';
        const cellNotes = soloState.notes[r][c];
        if (cellNotes.size > 0) {
          notesGrid.style.display = 'grid';
          for (let i = 1; i <= 9; i++) {
            const noteEl = notesGrid.querySelector(`.note-${i}`);
            noteEl.textContent = cellNotes.has(i) ? i : '';
          }
        } else {
          notesGrid.style.display = 'none';
        }
      }

      cellEl.classList.toggle('given', given);
      cellEl.classList.remove('selected', 'peer', 'same-value');

      if (soloState.selected) {
        const [sr, sc] = soloState.selected;
        const sameRow = r === sr, sameCol = c === sc;
        const sameBox = Math.floor(r / BOX) === Math.floor(sr / BOX) && Math.floor(c / BOX) === Math.floor(sc / BOX);
        if (sameRow && sameCol) cellEl.classList.add('selected');
        else if (sameRow || sameCol || sameBox) cellEl.classList.add('peer');
        const selVal = soloState.board[sr][sc];
        if (selVal !== 0 && v === selVal) cellEl.classList.add('same-value');
      }
    }
  }
}

document.getElementById('solo-btn-note').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!soloState) return;
  soloState.notesMode = !soloState.notesMode;
  document.getElementById('solo-btn-note').style.borderColor = soloState.notesMode ? 'var(--gold)' : '';
});

document.getElementById('solo-btn-erase').addEventListener('click', (e) => { e.stopPropagation(); soloEraseCell(); });
document.getElementById('solo-btn-check').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!soloState || soloState.over) return;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = soloState.board[r][c];
      if (v !== 0 && v !== soloState.solution[r][c]) {
        document.getElementById(`solo-board-${r}-${c}`).classList.add('error');
      }
    }
  }
});

document.addEventListener('click', () => {
  if (els.soloScreen.style.display === 'block' && soloState && soloState.selected) {
    soloState.selected = null;
    soloRender();
  }
});

document.addEventListener('keydown', (e) => {
  if (els.soloScreen.style.display !== 'block') return;
  if (e.key === 'Shift') { if (soloState) soloState.notesMode = !soloState.notesMode; return; }
  if (!soloState || !soloState.selected || soloState.over) return;
  let [r, c] = soloState.selected;

  if (e.key >= '1' && e.key <= '9') {
    soloInputNumber(parseInt(e.key, 10));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    soloEraseCell();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key === 'ArrowUp') r = (r - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowDown') r = (r + 1) % SIZE;
    else if (e.key === 'ArrowLeft') c = (c - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowRight') c = (c + 1) % SIZE;
    soloSelectCell(r, c);
  }
});

// --- 單機通用彈窗 ---
function showSoloDialog(title, desc, actions) {
  soloEls.dialogTitle.textContent = title;
  soloEls.dialogDesc.textContent = desc;
  soloEls.dialogActions.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.textContent = a.label;
    btn.className = a.primary ? 'primary' : 'secondary';
    btn.addEventListener('click', () => { closeSoloDialog(); a.action(); });
    soloEls.dialogActions.appendChild(btn);
  });
  soloEls.dialogOverlay.classList.add('show');
}
function closeSoloDialog() { soloEls.dialogOverlay.classList.remove('show'); }

// --- 畫面切換 ---
document.getElementById('btn-enter-solo').addEventListener('click', () => {
  els.homeScreen.style.display = 'none';
  els.soloScreen.style.display = 'block';
  ensureSoloBoardBuilt();
  refreshSoloDifficultyButtons();
  resetSoloBoard();
});

document.getElementById('btn-back-home').addEventListener('click', () => {
  stopSoloTimers();
  closeSoloDialog();
  els.soloScreen.style.display = 'none';
  els.homeScreen.style.display = 'block';
});
</script>
</body>
</html>
