<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數獨 Sudoku - Pro (對戰版)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #14171f;
    --bg-soft: #1b1f2a;
    --bg-soft-2: #21273a;
    --paper: #fbf7ed;
    --paper-line: #e4dcc8;
    --ink: #23262b;
    --ink-soft: #6b6558;
    --gold: #d8a73d;
    --gold-soft: #e9c876;
    --teal: #2e8b84;
    --teal-soft: #7fc2bc;
    --red: #c1494d;
    --border-thick: #23262b;
    --note-color: #7b8393;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(216,167,61,0.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(46,139,132,0.09), transparent 50%);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::after {
    content: ""; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.045; mix-blend-mode: overlay; pointer-events: none; z-index: 1;
  }

  .corner { position: fixed; width: 22px; height: 22px; border-color: rgba(216,167,61,0.35); pointer-events: none; z-index: 40; }
  .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 20px 60px; position: relative; z-index: 2; }

  header { text-align: center; margin-bottom: 34px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 12px; }
  .eyebrow::before, .eyebrow::after { content: "—"; color: rgba(233,200,118,0.4); margin: 0 10px; }

  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 54px; margin: 0; letter-spacing: 0.02em; color: var(--paper); }
  h1 .accent { color: var(--teal-soft); font-style: italic; font-weight: 600; }

  .subtitle { margin-top: 12px; font-size: 13px; color: #8b93a3; letter-spacing: 0.03em; }
  #online-status { margin-top: 10px; font-size: 12px; font-weight: 600; color: #7b8393; }

  /* 房間大廳畫面 */
  #lobby-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg-soft); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 40px; max-width: 500px; margin: 40px auto; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  #lobby-screen h2 { font-family: 'Fraunces', serif; margin-top: 0; color: var(--gold-soft); }
  .lobby-group { margin: 15px 0; width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .lobby-group input {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.2); color: var(--paper);
    padding: 12px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; text-align: center;
  }
  .lobby-group input:focus { outline: 2px solid var(--teal-soft); }

  /* 遊戲主介面預設隱藏 */
  #game-container { display: none; }

  .layout { display: flex; gap: 32px; align-items: flex-start; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

  .board-card {
    background: var(--paper); border-radius: 6px; padding: 22px;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04); position: relative;
  }
  .board-card::before {
    content: ""; position: absolute; inset: 10px; border: 1px solid var(--paper-line); border-radius: 3px; pointer-events: none;
  }

  #board {
    display: grid; grid-template-columns: repeat(9, 44px); grid-template-rows: repeat(9, 44px);
    gap: 0; border: 2.5px solid var(--border-thick); background: var(--border-thick); user-select: none;
  }

  .cell {
    background: var(--paper); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500; color: var(--teal); cursor: pointer; position: relative; transition: background 0.1s ease;
  }
  .cell .notes-grid { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
  .cell .note-number { font-size: 10px; color: var(--note-color); display: flex; align-items: center; justify-content: center; line-height: 1; }
  .cell.given { color: var(--ink); font-weight: 600; cursor: default; }

  .cell:nth-child(3n) { border-right: 2px solid var(--border-thick); }
  .cell:nth-child(9n) { border-right: none; }
  #board .cell:nth-child(n+19):nth-child(-n+27),
  #board .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border-thick); }

  .cell:not(.given):not(.error):hover { background: #f1ead6; }
  .cell.selected { background: #f4e6b8; box-shadow: inset 0 0 0 2.5px var(--teal); z-index: 5; }
  .cell.peer { background: #f7f1de; }
  .cell.same-value:not(.selected) { background: #ecdfae; }
  .cell.error { color: var(--red); background: #f6dede; }

  .shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  .panel { width: 250px; display: flex; flex-direction: column; gap: 18px; }
  .panel-block {
    background: linear-gradient(180deg, var(--bg-soft-2), var(--bg-soft));
    border: 1px solid rgba(255,255,255,0.07); border-radius: 6px; padding: 16px 18px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,0.7);
  }

  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-soft); }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Fraunces', serif; }
  .stat-row .value { font-size: 26px; font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; }

  button {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; border: 1px solid rgba(255,255,255,0.12);
    background: transparent; color: var(--paper); padding: 9px 10px; border-radius: 4px; cursor: pointer;
    transition: all 0.15s ease; width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 5px;
  }
  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-soft); background: rgba(255,255,255,0.02); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .numpad button { padding: 10px 0; font-size: 16px; font-weight: 500; width: auto; margin: 0; }

  .action-buttons button { text-align: left; padding: 12px; justify-content: flex-start; font-size: 14px; }
  .action-buttons button .k { color: var(--teal-soft); margin-right: 8px; font-weight: 600; width: 1.2em; text-align: center; }

  /* 彈跳視窗 */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,17,0.92); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s ease;
  }
  .overlay.show { display: flex; opacity: 1; }
  .end-card {
    background: var(--paper); color: var(--ink); padding: 40px 50px; border-radius: 8px; text-align: center;
    max-width: 400px; box-shadow: 0 40px 90px -20px rgba(0,0,0,0.8);
  }
  .end-card h2 { font-family: 'Fraunces', serif; font-size: 38px; margin: 0 0 10px; }
  .end-card p { color: var(--ink-soft); font-size: 15px; margin: 0 0 25px; line-height: 1.6; }
  .end-card button.primary {
    background: var(--teal); color: var(--paper); border: none; padding: 12px 24px; font-weight: 600; font-size: 15px; width: 100%; border-radius: 4px; cursor: pointer;
  }
  .end-card button.primary:hover { background: #226b65; }

  @media (max-width: 850px) {
    .wrap { padding: 30px 15px; }
    #board { grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(9, 36px); }
    .cell { font-size: 17px; }
    .panel { width: 100%; max-width: 400px; margin: 0 auto; }
  }
</style>
</head>
<body>

<input type="text" id="mobile-input" inputmode="numeric" style="position: absolute; top: -1000px; left: -1000px; opacity: 0; pointer-events: none;">

<!-- 房間大廳畫面 -->
<div class="wrap" id="lobby-screen">
  <div class="eyebrow">1v1 競速對戰模式</div>
  <h1>數<span class="accent">獨</span> 對決</h1>
  <div id="online-status" style="margin-bottom: 20px;">🟡 連線伺服器中...</div>
  
  <div class="lobby-group">
    <button class="primary" id="btn-create-room" style="background: var(--teal); border:none; padding:14px; font-size:16px; font-weight:600; border-radius:4px; cursor:pointer; color:var(--paper);">建立新房間</button>
  </div>
  
  <div style="margin: 15px 0; color: #6b6558; font-size: 13px;">— 或者 —</div>

  <div class="lobby-group">
    <input type="text" id="input-room-id" placeholder="請輸入 4 碼房號">
    <button id="btn-join-room" style="background: var(--bg-soft-2); border: 1px solid var(--teal-soft); padding: 12px; font-size: 15px; color: var(--teal-soft);">加入房間</button>
  </div>
</div>

<!-- 遊戲主畫面 (預設隱藏) -->
<div class="wrap" id="game-container">
  <header>
    <div class="eyebrow" id="room-info-label">房間代碼: ----</div>
    <h1>數<span class="accent">獨</span> 競技</h1>
    <div class="subtitle" id="game-status">等待對手加入中...</div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="panel-block numpad-block">
        <div class="panel-header">
          <div class="panel-label">數字鍵盤</div>
          <button id="btn-note" style="width:auto; padding:4px 8px; font-size:11px;">✎ 筆記</button>
        </div>
        <div class="numpad" id="numpad"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">對戰即時戰況</div>
        <div style="margin-top: 10px; font-size: 13px; line-height: 1.6;">
          <div>我的進度: <span id="my-progress" style="color: var(--teal-soft); font-weight:600;">0%</span></div>
          <div>對手進度: <span id="opponent-progress" style="color: var(--gold-soft); font-weight:600;">0%</span></div>
          <div>對手錯誤: <span id="opponent-mistakes" style="color: var(--red);">0</span> 次</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 14px;">動作</div>
        <div class="action-buttons">
          <button id="btn-check"><span class="k">✓</span>檢查盤面</button>
          <button id="btn-erase"><span class="k">⌫</span>清除格子</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 遊戲結束/勝負結算彈窗 -->
<div id="result-overlay" class="overlay">
  <div class="end-card">
    <h2 id="result-title">對戰結束</h2>
    <p id="result-desc">恭喜你獲得勝利！</p>
    <button id="result-close" class="primary">返回大廳</button>
  </div>
</div>

<!-- Socket.io 前端套件 -->
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let currentRoomId = null;
const SIZE = 9, BOX = 3;

let state = {
  puzzle: null, solution: null, board: null, 
  notes: null, selected: null, mistakes: 0,
  started: false, won: false, gameOver: false, notesMode: false
};

const els = {
  lobbyScreen: document.getElementById('lobby-screen'),
  gameContainer: document.getElementById('game-container'),
  onlineStatus: document.getElementById('online-status'),
  roomInfoLabel: document.getElementById('room-info-label'),
  gameStatus: document.getElementById('game-status'),
  board: document.getElementById('board'),
  numpad: document.getElementById('numpad'),
  myProgress: document.getElementById('my-progress'),
  opponentProgress: document.getElementById('opponent-progress'),
  opponentMistakes: document.getElementById('opponent-mistakes'),
  resultOverlay: document.getElementById('result-overlay'),
  resultTitle: document.getElementById('result-title'),
  resultDesc: document.getElementById('result-desc'),
  resultClose: document.getElementById('result-close')
};

// --- 連線狀態監聽 ---
socket.on('connect', () => {
  els.onlineStatus.textContent = '🟢 已連線至對戰伺服器';
  els.onlineStatus.style.color = 'var(--teal-soft)';
});

socket.on('disconnect', () => {
  els.onlineStatus.textContent = '🔴 與伺服器斷線';
  els.onlineStatus.style.color = 'var(--red)';
});

// 房間建立成功或加入成功
socket.on('room_joined', (data) => {
  currentRoomId = data.roomId;
  els.lobbyScreen.style.display = 'none';
  els.gameContainer.style.display = 'block';
  els.roomInfoLabel.textContent = `房間代碼: ${currentRoomId}`;
  els.gameStatus.textContent = '等待對手加入房間中...';
  buildBoardDOM();
  buildNumpad();
});

// 房號錯誤提示
socket.on('error_msg', (msg) => {
  alert(msg);
});

// 雙人到齊，伺服器派發題目開始對戰
socket.on('start_game', (data) => {
  const { puzzle, solution } = data;
  loadGame(puzzle, solution);
  els.gameStatus.textContent = '⚔️ 雙人競速對戰開始！先解開者獲勝！';
  els.gameStatus.style.color = 'var(--gold-soft)';
  state.started = true;
});

// 接收對手的進度更新
socket.on('opponent_update', (data) => {
  els.opponentProgress.textContent = `${data.progress}%`;
  els.opponentMistakes.textContent = data.mistakes;
});

// 接收對戰勝負結果
socket.on('game_over', (data) => {
  state.gameOver = true;
  if (data.winner === socket.id) {
    els.resultTitle.textContent = "勝利！🎉";
    els.resultTitle.style.color = "var(--teal)";
    els.resultDesc.textContent = "太神啦！你比對手更快完成數獨！";
  } else {
    els.resultTitle.textContent = "落敗... 😢";
    els.resultTitle.style.color = "var(--red)";
    els.resultDesc.textContent = "慢了一步！對手已經率先通關了！";
  }
  els.resultOverlay.classList.add('show');
});

// --- 大廳按鈕事件 ---
document.getElementById('btn-create-room').addEventListener('click', () => {
  socket.emit('create_room');
});

document.getElementById('btn-join-room').addEventListener('click', () => {
  const roomId = document.getElementById('input-room-id').value.trim();
  if (!roomId) {
    alert('請輸入房號！');
    return;
  }
  socket.emit('join_room', { roomId });
});

// --- 遊戲邏輯 ---
function emptyBoard() { return Array.from({length: SIZE}, () => Array(SIZE).fill(0)); }
function emptyNotesBoard() { return Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => new Set())); }

function loadGame(puzzle, solution) {
  state = {
    puzzle, solution, board: puzzle.map(row => row.slice()),
    notes: emptyNotesBoard(), selected: null, mistakes: 0,
    started: true, won: false, gameOver: false, notesMode: false
  };
  render();
  updateMyProgress();
}

function buildBoardDOM() {
  els.board.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      
      const notesGrid = document.createElement('div');
      notesGrid.className = 'notes-grid';
      for(let i=1; i<=9; i++) {
        const noteNum = document.createElement('span');
        noteNum.className = `note-number note-${i}`;
        notesGrid.appendChild(noteNum);
      }
      cell.appendChild(notesGrid);

      const valSpan = document.createElement('span');
      valSpan.className = 'cell-value';
      cell.appendChild(valSpan);

      cell.addEventListener('click', (e) => { e.stopPropagation(); selectCell(r, c); });
      els.board.appendChild(cell);
    }
  }
}

function buildNumpad() {
  els.numpad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', (e) => { e.stopPropagation(); inputNumber(n); });
    els.numpad.appendChild(b);
  }
}

function selectCell(r, c) {
  if (state.won || state.gameOver || !state.started) return;
  state.selected = [r, c];
  render();
  const mobileInput = document.getElementById('mobile-input');
  if (mobileInput) { mobileInput.value = ''; mobileInput.focus(); }
}

document.addEventListener('click', () => {
  if (state.selected) { state.selected = null; render(); }
});

function inputNumber(num) {
  if (state.won || state.gameOver || !state.selected || !state.started) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return; 

  if (state.notesMode) {
    const cellNotes = state.notes[r][c];
    if (cellNotes.has(num)) cellNotes.delete(num); 
    else cellNotes.add(num);
  } else {
    state.board[r][c] = num;
    state.notes[r][c].clear();
    
    const cellEl = getCellEl(r, c);
    cellEl.classList.remove('error');

    if (num !== state.solution[r][c]) {
      state.mistakes++;
      cellEl.classList.add('error', 'shake');
      setTimeout(() => cellEl.classList.remove('shake'), 350);
    } else {
      checkWinCondition();
    }
    updateMyProgress();
  }
  render();
}

function eraseCell() {
  if (state.won || state.gameOver || !state.selected || !state.started) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return;

  if (state.notesMode) {
    state.notes[r][c].clear(); 
  } else {
    state.board[r][c] = 0; 
    getCellEl(r, c).classList.remove('error');
    updateMyProgress();
  }
  render();
}

function updateMyProgress() {
  let totalEmpties = 0;
  let correctFilled = 0;
  for (let r=0; r<SIZE; r++) {
    for (let c=0; c<SIZE; c++) {
      if (state.puzzle[r][c] === 0) {
        totalEmpties++;
        if (state.board[r][c] === state.solution[r][c]) {
          correctFilled++;
        }
      }
    }
  }
  const progress = totalEmpties === 0 ? 100 : Math.floor((correctFilled / totalEmpties) * 100);
  els.myProgress.textContent = `${progress}%`;

  // 傳送進度給伺服器，讓對手看到
  socket.emit('update_progress', { roomId: currentRoomId, progress, mistakes: state.mistakes });
}

function checkWinCondition() {
  const filled = state.board.every((row, r) => row.every((v, c) => v === state.solution[r][c]));
  if (filled && !state.won) {
    state.won = true;
    socket.emit('win_game', { roomId: currentRoomId });
  }
}

function render() {
  for (let r=0; r<SIZE; r++) {
    for (let c=0; c<SIZE; c++) {
      const cellEl = getCellEl(r, c);
      const valSpan = cellEl.querySelector('.cell-value');
      const notesGrid = cellEl.querySelector('.notes-grid');
      const v = state.board[r][c];
      const given = state.puzzle[r][c] !== 0;

      if (v !== 0) {
        valSpan.textContent = v;
        notesGrid.style.display = 'none'; 
        valSpan.style.display = 'block';
      } else {
        valSpan.textContent = '';
        valSpan.style.display = 'none';
        const cellNotes = state.notes[r][c];
        if (cellNotes.size > 0) {
          notesGrid.style.display = 'grid';
          for(let i=1; i<=9; i++) {
            const noteEl = notesGrid.querySelector(`.note-${i}`);
            noteEl.textContent = cellNotes.has(i) ? i : '';
          }
        } else {
          notesGrid.style.display = 'none';
        }
      }

      cellEl.classList.toggle('given', given);
      cellEl.classList.remove('selected', 'peer', 'same-value');

      if (state.selected) {
        const [sr, sc] = state.selected;
        const sameRow = r === sr, sameCol = c === sc;
        const sameBox = Math.floor(r/BOX) === Math.floor(sr/BOX) && Math.floor(c/BOX) === Math.floor(sc/BOX);
        
        if (sameRow && sameCol) cellEl.classList.add('selected');
        else if (sameRow || sameCol || sameBox) cellEl.classList.add('peer');

        const selVal = state.board[sr][sc];
        if (selVal !== 0 && v === selVal) cellEl.classList.add('same-value');
      }
    }
  }
}

function getCellEl(r, c) { return document.getElementById(`cell-${r}-${c}`); }

// 按鈕與快速鍵綁定
document.getElementById('btn-note').addEventListener('click', (e) => {
  e.stopPropagation();
  state.notesMode = !state.notesMode;
  document.getElementById('btn-note').style.borderColor = state.notesMode ? 'var(--gold)' : '';
});

document.getElementById('btn-erase').addEventListener('click', (e) => { e.stopPropagation(); eraseCell(); });
document.getElementById('btn-check').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!state.started || state.gameOver) return;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = state.board[r][c];
      if (v !== 0 && v !== state.solution[r][c]) {
        getCellEl(r, c).classList.add('error');
      }
    }
  }
});

els.resultClose.addEventListener('click', () => {
  location.reload(); // 重新整理返回大廳
});

// 鍵盤輸入監聽
document.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') {
    state.notesMode = !state.notesMode;
    return;
  }
  if (!state.selected || state.gameOver || !state.started) return;
  let [r, c] = state.selected;

  if (e.key >= '1' && e.key <= '9') {
    inputNumber(parseInt(e.key, 10));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key === 'ArrowUp') r = (r - 1 + SIZE) % SIZE; 
    else if (e.key === 'ArrowDown') r = (r + 1) % SIZE;
    else if (e.key === 'ArrowLeft') c = (c - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowRight') c = (c + 1) % SIZE;
    selectCell(r, c);
  }
});
</script>
