<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數獨 Sudoku - Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #14171f;
    --bg-soft: #1b1f2a;
    --bg-soft-2: #21273a;
    --paper: #fbf7ed;
    --paper-line: #e4dcc8;
    --ink: #23262b;
    --ink-soft: #6b6558;
    --gold: #d8a73d;
    --gold-soft: #e9c876;
    --teal: #2e8b84;
    --teal-soft: #7fc2bc;
    --red: #c1494d;
    --border-thick: #23262b;
    --note-color: #7b8393;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(216,167,61,0.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(46,139,132,0.09), transparent 50%);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.045;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 1;
  }

  .corner {
    position: fixed;
    width: 22px;
    height: 22px;
    border-color: rgba(216,167,61,0.35);
    pointer-events: none;
    z-index: 40;
  }
  .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 20px 60px;
    position: relative;
    z-index: 2;
  }

  header {
    text-align: center;
    margin-bottom: 34px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 12px;
  }

  .eyebrow::before, .eyebrow::after {
    content: "—";
    color: rgba(233,200,118,0.4);
    margin: 0 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 54px;
    margin: 0;
    letter-spacing: 0.02em;
    color: var(--paper);
  }

  h1 .accent { color: var(--teal-soft); font-style: italic; font-weight: 600; }

  .subtitle {
    margin-top: 12px;
    font-size: 13px;
    color: #8b93a3;
    letter-spacing: 0.03em;
    transition: color 0.2s ease;
    height: 1.2em;
  }

  .layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ---------- Board ---------- */
  .board-card {
    background: var(--paper);
    border-radius: 6px;
    padding: 22px;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
  }

  .board-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    pointer-events: none;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 44px);
    grid-template-rows: repeat(9, 44px);
    gap: 0;
    border: 2.5px solid var(--border-thick);
    background: var(--border-thick);
    user-select: none;
  }

  .cell {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 500;
    color: var(--teal);
    cursor: pointer;
    position: relative;
    transition: background 0.1s ease;
  }

  .cell .notes-grid {
    position: absolute;
    inset: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    pointer-events: none;
  }

  .cell .note-number {
    font-size: 10px;
    color: var(--note-color);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-weight: 400;
  }

  .cell.given { color: var(--ink); font-weight: 600; cursor: default; }

  .cell:nth-child(3n) { border-right: 2px solid var(--border-thick); }
  .cell:nth-child(9n) { border-right: none; }
  #board .cell:nth-child(n+19):nth-child(-n+27),
  #board .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border-thick); }

  .cell:not(.given):not(.error):hover { background: #f1ead6; }
  .cell.selected { background: #f4e6b8; box-shadow: inset 0 0 0 2.5px var(--teal); z-index: 5; }
  .cell.peer { background: #f7f1de; }
  .cell.same-value:not(.selected) { background: #ecdfae; }

  .cell.error { color: var(--red); background: #f6dede; }
  .cell.error.given { color: var(--red); }

  .cell.hint-fill { animation: pop 0.3s ease; }
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0.5; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  /* ---------- Side panel ---------- */
  .panel {
    width: 250px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel-block {
    background: linear-gradient(180deg, var(--bg-soft-2), var(--bg-soft));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 16px 18px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,0.7);
  }

  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-soft); }
  
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Fraunces', serif; }
  .stat-row .value { font-size: 26px; font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; transition: color 0.3s ease; }

  .mistake-count { font-size: 18px; color: #8b93a3; }
  .mistake-count .current { color: var(--paper); font-weight: 600; }
  .mistake-count.danger .current { color: var(--red); animation: pulseRed 0.5s ease 2; }
  @keyframes pulseRed { 50% { opacity: 0.5; } }

  .diff-buttons { display: flex; flex-direction: column; gap: 8px; }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: var(--paper);
    padding: 9px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }

  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-soft); background: rgba(255,255,255,0.02); }
  button:focus-visible { outline: 2px solid var(--teal-soft); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }

  .diff-buttons button.active { background: var(--gold); border-color: var(--gold); color: #23262b; font-weight: 600; }

  #btn-note { width: auto; flex: none; padding: 6px 10px; font-size: 12px; border-color: rgba(123, 131, 147, 0.4); color: var(--note-color); }
  #btn-note.active { background: var(--note-color); color: var(--paper); border-color: var(--note-color); box-shadow: 0 0 10px rgba(123, 131, 147, 0.3); }

  .action-buttons { display: flex; flex-direction: column; gap: 10px; }
  .action-buttons button { width: 100%; text-align: left; padding: 12px; justify-content: flex-start; font-size: 14px; }
  .action-buttons button .k { color: var(--teal-soft); margin-right: 8px; font-weight: 600; width: 1.2em; text-align: center; }

  .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .numpad button { padding: 10px 0; font-size: 16px; font-weight: 500; }

  footer { text-align: center; margin-top: 40px; font-size: 12px; color: #545b6b; letter-spacing: 0.05em; position: relative; z-index: 2; }

  /* ---------- Overlays (Win / Game Over / Snarky) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,17,0.92); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s ease;
  }
  .overlay.show { display: flex; opacity: 1; }
  .end-card {
    background: var(--paper); color: var(--ink); padding: 40px 50px; border-radius: 8px; text-align: center;
    max-width: 400px; box-shadow: 0 40px 90px -20px rgba(0,0,0,0.8);
    transform: scale(0.9) translateY(10px); transition: transform 0.3s ease;
  }
  .overlay.show .end-card { transform: scale(1) translateY(0); }
  .end-card h2 { font-family: 'Fraunces', serif; font-size: 38px; margin: 0 0 10px; }
  .end-card p { color: var(--ink-soft); font-size: 15px; margin: 0 0 25px; line-height: 1.6; white-space: pre-wrap; }
  .end-card button.primary { background: var(--teal); color: var(--paper); border: none; padding: 12px 24px; font-weight: 600; font-size: 15px; width: 100%; }
  .end-card button.primary:hover:not(:disabled) { background: #226b65; }

  #win-overlay h2 { color: var(--teal); }
  #gameover-overlay h2 { color: var(--red); }
  #gameover-overlay .end-card { border-top: 4px solid var(--red); }
  
  /* 嘲諷視窗專屬樣式 */
  #snarky-overlay h2 { color: var(--gold); }
  #snarky-overlay .end-card { border-top: 4px solid var(--gold); }
  #snarky-overlay p { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 30px; }

  @media (max-width: 850px) {
    .corner { display: none; }
    .wrap { padding: 30px 15px; }
    #board { grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(9, 36px); }
    .cell { font-size: 17px; }
    .cell .note-number { font-size: 8px; }
    .panel { width: 100%; max-width: 400px; margin: 0 auto; }
    
    .panel-block.numpad-block {
      order: -1; position: sticky; bottom: 10px; z-index: 30;
      background: rgba(27,31,42,0.96); backdrop-filter: blur(10px);
      border-color: rgba(255,255,255,0.1); margin-top: 10px;
    }
  }
</style>
</head>
<body>

<!-- 新增這個隱藏的輸入框來觸發手機小鍵盤 -->
<input type="text" id="mobile-input" inputmode="numeric" style="position: absolute; top: -1000px; left: -1000px; opacity: 0; pointer-events: none;">

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">終端機的紙本謎題</div>
    <h1>數<span class="accent">獨</span> Sudoku</h1>
    <div class="subtitle" id="game-status">點格子輸入，或按 Shift 鍵切換筆記模式</div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="panel-block numpad-block">
        <div class="panel-header">
          <div class="panel-label">數字鍵盤</div>
          <button id="btn-note" title="切換筆記模式 (快捷鍵: Shift)">✎ 筆記</button>
        </div>
        <div class="numpad" id="numpad"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">剩餘時間 / 錯誤</div>
        <div class="stat-row">
          <span class="value" id="timer">--:--</span>
          <span class="mistake-count" id="mistake-panel">
            錯誤 <span class="current" id="mistakes">0</span> / 3
          </span>
        </div>
      </div>

      <div class="panel-block">
        <div class="panel-label">難度闖關 (請先解鎖)</div>
        <div class="diff-buttons" id="diff-buttons">
          <button data-diff="35" data-level="1" class="active">簡單 (6 分鐘)</button>
          <button data-diff="45" data-level="2">中等 (8 分鐘)</button>
          <button data-diff="55" data-level="3">困難 (12 分鐘)</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-block">
        <div class="panel-label" style="margin-bottom: 14px;">動作</div>
        <div class="action-buttons">
          <button id="btn-new"><span class="k">↻</span>重新開始本局</button>
          <button id="btn-hint"><span class="k">?</span>提示一格 (1/1)</button>
          <button id="btn-check"><span class="k">✓</span>檢查盤面</button>
          <button id="btn-erase"><span class="k">⌫</span>清除格子</button>
        </div>
      </div>
    </div>
  </div>

  <footer>鍵盤 1-9 輸入，方向鍵移動，Shift 切換筆記，Backspace 清除</footer>
</div>

<!-- 勝利畫面 -->
<div id="win-overlay" class="overlay">
  <div class="end-card">
    <h2>完成了！</h2>
    <p id="win-detail">恭喜解出這個數獨。</p>
    <button id="win-close" class="primary">下一關</button>
  </div>
</div>

<!-- 遊戲結束畫面 -->
<div id="gameover-overlay" class="overlay">
  <div class="end-card">
    <h2>遊戲結束</h2>
    <p id="gameover-desc">很遺憾，您已經達到了錯誤上限。</p>
    <button id="gameover-close" class="primary">重新挑戰</button>
  </div>
</div>

<!-- 嘲諷畫面 (共用模組) -->
<div id="snarky-overlay" class="overlay">
  <div class="end-card">
    <h2 id="snarky-title">時間到！</h2>
    <p id="snarky-msg">還想先把全部看完再填阿，遜咖</p>
    <button id="snarky-close" class="primary">我知道錯了</button>
  </div>
</div>

<script>
// --- 關卡難度與時間設定 ---
const LEVEL_CONFIG = {
  35: { level: 1, time: 6 * 60, name: '簡單' },
  45: { level: 2, time: 8 * 60, name: '中等' },
  55: { level: 3, time: 12 * 60, name: '困難' }
};

const SIZE = 9, BOX = 3;
const MAX_MISTAKES = 3;

// 從 localStorage 讀取解鎖進度，預設為 1 (簡單)
let unlockedLevel = parseInt(localStorage.getItem('sudoku_unlocked') || '1', 10);

function emptyBoard() { return Array.from({length: SIZE}, () => Array(SIZE).fill(0)); }
function emptyNotesBoard() { return Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => new Set())); }

function isValid(board, row, col, num) {
  for (let i = 0; i < SIZE; i++) if (board[row][i] === num || board[i][col] === num) return false;
  const br = Math.floor(row / BOX) * BOX, bc = Math.floor(col / BOX) * BOX;
  for (let r = br; r < br + BOX; r++) for (let c = bc; c < bc + BOX; c++) if (board[r][c] === num) return false;
  return true;
}

function findEmpty(board) {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === 0) return [r, c];
  return null;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function solve(board, randomize) {
  const empty = findEmpty(board);
  if (!empty) return true;
  const [row, col] = empty;
  let nums = [1,2,3,4,5,6,7,8,9];
  if (randomize) shuffle(nums);
  for (const num of nums) {
    if (isValid(board, row, col, num)) {
      board[row][col] = num;
      if (solve(board, randomize)) return true;
      board[row][col] = 0;
    }
  }
  return false;
}

function countSolutions(board, limit) {
  const empty = findEmpty(board);
  if (!empty) return 1;
  const [row, col] = empty;
  let count = 0;
  for (let num = 1; num <= 9; num++) {
    if (isValid(board, row, col, num)) {
      board[row][col] = num;
      count += countSolutions(board, limit);
      board[row][col] = 0;
      if (count >= limit) break;
    }
  }
  return count;
}

function generatePuzzle(holes) {
  const solution = emptyBoard();
  solve(solution, true);
  const puzzle = solution.map(row => row.slice());
  const cells = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) cells.push([r,c]);
  shuffle(cells);
  let removed = 0;
  for (const [r, c] of cells) {
    if (removed >= holes) break;
    const backup = puzzle[r][c];
    puzzle[r][c] = 0;
    if (countSolutions(puzzle.map(row => row.slice()), 2) !== 1) puzzle[r][c] = backup;
    else removed++;
  }
  return { puzzle, solution };
}

let state = {
  puzzle: null, solution: null, board: null, 
  notes: null, selected: null, mistakes: 0, holes: 35,
  timerInterval: null, timerStart: null, timeLeft: 0,
  idleTimeout: null, // 閒置嘲諷計時器
  started: false, won: false, gameOver: false,
  notesMode: false, hintsUsed: 0,
  timeTauntShown: false // 新增：是否已經觸發過時間過半的嘲諷
};

const els = {
  board: document.getElementById('board'),
  timer: document.getElementById('timer'),
  mistakes: document.getElementById('mistakes'),
  mistakePanel: document.getElementById('mistake-panel'),
  numpad: document.getElementById('numpad'),
  status: document.getElementById('game-status'),
  btnNote: document.getElementById('btn-note'),
  btnHint: document.getElementById('btn-hint'),
  winOverlay: document.getElementById('win-overlay'),
  winDetail: document.getElementById('win-detail'),
  gameOverOverlay: document.getElementById('gameover-overlay'),
  gameoverDesc: document.getElementById('gameover-desc'),
  snarkyOverlay: document.getElementById('snarky-overlay'),
  snarkyTitle: document.getElementById('snarky-title'),
  snarkyMsg: document.getElementById('snarky-msg'),
  snarkyClose: document.getElementById('snarky-close')
};

// 顯示動態嘲諷視窗
function showSnarkyMsg(title, msg, btnText = "我知道錯了") {
  els.snarkyTitle.textContent = title;
  els.snarkyMsg.textContent = msg;
  els.snarkyClose.textContent = btnText;
  els.snarkyOverlay.classList.add('show');
}

// 更新按鈕解鎖狀態
function updateDiffButtons() {
  document.querySelectorAll('.diff-buttons button').forEach(btn => {
    const lvl = parseInt(btn.dataset.level, 10);
    const diff = parseInt(btn.dataset.diff, 10);
    const timeMin = LEVEL_CONFIG[diff].time / 60;
    
    if (lvl > unlockedLevel) {
      btn.disabled = true;
      btn.innerHTML = `🔒 ${LEVEL_CONFIG[diff].name} (需通關上一難度)`;
    } else {
      btn.disabled = false;
      btn.innerHTML = `${LEVEL_CONFIG[diff].name} (${timeMin} 分鐘)`;
    }
  });
}

function buildBoardDOM() {
  els.board.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      
      const notesGrid = document.createElement('div');
      notesGrid.className = 'notes-grid';
      for(let i=1; i<=9; i++) {
        const noteNum = document.createElement('span');
        noteNum.className = `note-number note-${i}`;
        notesGrid.appendChild(noteNum);
      }
      cell.appendChild(notesGrid);
      
      const valSpan = document.createElement('span');
      valSpan.className = 'cell-value';
      cell.appendChild(valSpan);

      cell.addEventListener('click', (e) => { e.stopPropagation(); selectCell(r, c); });
      els.board.appendChild(cell);
    }
  }
}

function buildNumpad() {
  els.numpad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', (e) => { e.stopPropagation(); inputNumber(n); });
    els.numpad.appendChild(b);
  }
}

function newGame(holes) {
  clearTimeout(state.idleTimeout); // 清除舊的閒置計時器

  if (holes) state.holes = holes;
  updateDiffButtons();
  flashStatus('正在為您準備謎題...', true);
  
  setTimeout(() => {
    const { puzzle, solution } = generatePuzzle(state.holes);
    state = { ...state, 
      puzzle, solution, board: puzzle.map(row => row.slice()),
      notes: emptyNotesBoard(),
      selected: null, mistakes: 0, started: false, won: false, gameOver: false,
      hintsUsed: 0, timeTauntShown: false // 重置嘲諷狀態
    };
    
    els.btnHint.innerHTML = '<span class="k">?</span>提示一格 (1/1)';
    els.btnHint.disabled = false;

    stopTimer();
    state.timeLeft = LEVEL_CONFIG[state.holes].time;
    renderTime(state.timeLeft);
    
    els.mistakes.textContent = '0';
    els.mistakePanel.classList.remove('danger');
    els.winOverlay.classList.remove('show');
    els.gameOverOverlay.classList.remove('show');
    els.snarkyOverlay.classList.remove('show');
    document.querySelectorAll('.cell.error').forEach(el => el.classList.remove('error'));
    
    // --- 20秒放置Play嘲諷機制 ---
    els.status.textContent = '請盡快開始，超過 20 秒未動作將自動開始計時！';
    els.status.style.color = 'var(--gold-soft)';
    
    state.idleTimeout = setTimeout(() => {
      if (!state.started && !state.won && !state.gameOver) {
        showSnarkyMsg("抓到了！", "還想先把全部看完再填阿，遜咖", "馬上開始");
        ensureTimerStarted(); // 強制開始計時
      }
    }, 20000); // 20秒

    render();
  }, 50);
}

function selectCell(r, c) {
  if (state.won || state.gameOver) return;
  state.selected = [r, c];
  render();

  // 喚起手機原生數字鍵盤
  const mobileInput = document.getElementById('mobile-input');
  if (mobileInput) {
    mobileInput.value = ''; // 確保是空的
    mobileInput.focus();
  }
}

document.addEventListener('click', () => {
  if (state.selected) {
    state.selected = null;
    render();
  }
});

function inputNumber(num) {
  if (state.won || state.gameOver || !state.selected) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return; 

  ensureTimerStarted();

  if (state.notesMode) {
    if (state.board[r][c] !== 0) return; 
    const cellNotes = state.notes[r][c];
    if (cellNotes.has(num)) cellNotes.delete(num); 
    else cellNotes.add(num);
  } else {
    state.board[r][c] = num;
    state.notes[r][c].clear();
    
    const cellEl = getCellEl(r, c);
    cellEl.classList.remove('error');

    if (num !== state.solution[r][c]) {
      state.mistakes++;
      els.mistakes.textContent = state.mistakes;
      cellEl.classList.add('error', 'shake');
      if (state.mistakes >= MAX_MISTAKES - 1) els.mistakePanel.classList.add('danger');
      setTimeout(() => cellEl.classList.remove('shake'), 350);
      
      checkGameOver(); 
    } else {
      cellEl.classList.add('hint-fill');
      autoClearRelatedNotes(r, c, num);
      setTimeout(() => cellEl.classList.remove('hint-fill'), 300);
      checkWin(); 
    }
  }
  render();
}

function eraseCell() {
  if (state.won || state.gameOver || !state.selected) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return;
  
  if (state.notesMode && state.board[r][c] === 0) {
    state.notes[r][c].clear(); 
  } else {
    state.board[r][c] = 0; 
    getCellEl(r, c).classList.remove('error');
  }
  render();
}

function giveHint() {
  if (state.won || state.gameOver || state.hintsUsed >= 1) return;
  const empties = [];
  for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (state.board[r][c] === 0) empties.push([r, c]);
  if (empties.length === 0) return;

  ensureTimerStarted();
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  state.board[r][c] = state.solution[r][c];
  state.notes[r][c].clear(); 
  state.selected = [r, c];
  
  state.hintsUsed++;
  els.btnHint.innerHTML = '<span class="k">?</span>提示已使用 (0/1)';
  els.btnHint.disabled = true;

  render();
  const cellEl = getCellEl(r, c);
  cellEl.classList.remove('error');
  cellEl.classList.add('hint-fill');
  autoClearRelatedNotes(r, c, state.solution[r][c]);
  setTimeout(() => cellEl.classList.remove('hint-fill'), 350);
  checkWin();
}

function toggleNotesMode() {
  if (state.won || state.gameOver) return;
  state.notesMode = !state.notesMode;
  els.btnNote.classList.toggle('active', state.notesMode);
  updateStatusDefault();
}

function autoClearRelatedNotes(row, col, num) {
  for (let i=0; i<SIZE; i++) {
    state.notes[row][i].delete(num);
    state.notes[i][col].delete(num);
  }
  const br = Math.floor(row / BOX) * BOX, bc = Math.floor(col / BOX) * BOX;
  for (let r=br; r<br+BOX; r++) for (let c=bc; c<bc+BOX; c++) state.notes[r][c].delete(num);
}

// 勝利判定與解鎖邏輯
function checkWin() {
  const filled = state.board.every((row, r) => row.every((v, c) => v === state.solution[r][c]));
  if (filled) {
    state.won = true;
    stopTimer();
    
    const currentConfig = LEVEL_CONFIG[state.holes];
    let unlockMsg = '';

    if (currentConfig.level === unlockedLevel && currentConfig.level < 3) {
      unlockedLevel++;
      localStorage.setItem('sudoku_unlocked', unlockedLevel);
      updateDiffButtons();
      
      const nextLevelName = Object.values(LEVEL_CONFIG).find(cfg => cfg.level === unlockedLevel).name;
      unlockMsg = `\n🎉 恭喜！您已成功解鎖【${nextLevelName}】難度！`;
    }

    const timeUsed = currentConfig.time - state.timeLeft;
    const m = String(Math.floor(timeUsed / 60)).padStart(2,'0');
    const s = String(timeUsed % 60).padStart(2,'0');

    els.winDetail.textContent = `通關時間 ${m}:${s}，犯錯 ${state.mistakes} 次。${unlockMsg}`;
    els.winOverlay.classList.add('show');
  }
}

function checkGameOver(reason = 'mistakes') {
  if (state.mistakes >= MAX_MISTAKES || reason === 'time') {
    state.gameOver = true;
    stopTimer();
    
    if (reason === 'time') {
      els.gameoverDesc.textContent = "時間到了！您沒有在限制時間內完成盤面。";
    } else {
      els.gameoverDesc.textContent = "很遺憾，您已經達到了 3 次錯誤上限。";
    }
    els.gameOverOverlay.classList.add('show');
  }
}

function render() {
  for (let r=0; r<SIZE; r++) {
    for (let c=0; c<SIZE; c++) {
      const cellEl = getCellEl(r, c);
      const valSpan = cellEl.querySelector('.cell-value');
      const notesGrid = cellEl.querySelector('.notes-grid');
      const v = state.board[r][c];
      const given = state.puzzle[r][c] !== 0;

      if (v !== 0) {
        valSpan.textContent = v;
        notesGrid.style.display = 'none'; 
        valSpan.style.display = 'block';
      } else {
        valSpan.textContent = '';
        valSpan.style.display = 'none';
        const cellNotes = state.notes[r][c];
        if (cellNotes.size > 0) {
          notesGrid.style.display = 'grid';
          for(let i=1; i<=9; i++) {
            const noteEl = notesGrid.querySelector(`.note-${i}`);
            noteEl.textContent = cellNotes.has(i) ? i : '';
          }
        } else {
          notesGrid.style.display = 'none';
        }
      }

      cellEl.classList.toggle('given', given);
      cellEl.classList.remove('selected', 'peer', 'same-value');

      if (state.selected) {
        const [sr, sc] = state.selected;
        const sameRow = r === sr, sameCol = c === sc;
        const sameBox = Math.floor(r/BOX) === Math.floor(sr/BOX) && Math.floor(c/BOX) === Math.floor(sc/BOX);
        
        if (sameRow && sameCol) cellEl.classList.add('selected');
        else if (sameRow || sameCol || sameBox) cellEl.classList.add('peer');

        const selVal = state.board[sr][sc];
        if (selVal !== 0 && v === selVal) cellEl.classList.add('same-value');
      }
    }
  }
}

function getCellEl(r, c) { return document.getElementById(`cell-${r}-${c}`); }

// --- 倒數計時器與動態嘲諷邏輯 ---
function ensureTimerStarted() { 
  if (!state.started) { 
    clearTimeout(state.idleTimeout); // 玩家有動作了，清除閒置嘲諷計時器
    state.started = true; 
    startTimer(); 
    updateStatusDefault(); // 恢復正常標題
  } 
}
function startTimer() {
  stopTimer();
  state.timerStart = Date.now();
  state.timerInterval = setInterval(updateTimer, 500); 
}
function stopTimer() { clearInterval(state.timerInterval); }
function updateTimer() {
  if (!state.started || state.won || state.gameOver) return;
  const elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
  const totalLimit = LEVEL_CONFIG[state.holes].time;
  state.timeLeft = totalLimit - elapsed;
  
  // --- 依照難度的特定時間嘲諷機制 ---
  if (!state.timeTauntShown) {
    let tauntMsg = "";
    // 簡單版: 剩餘 3 分鐘 (180秒)
    if (state.holes === 35 && state.timeLeft <= 180) {
      tauntMsg = "剩餘3分鐘囉，是不是不行啊？\n菜，就多練";
    }
    // 中級版: 剩餘 4 分鐘 (240秒)
    else if (state.holes === 45 && state.timeLeft <= 240) {
      tauntMsg = "時間差不多囉，還沒完成嗎？\n難怪我一直聞到一股菜味";
    }
    // 高級版: 剩餘 6 分鐘 (360秒)
    else if (state.holes === 55 && state.timeLeft <= 360) {
      tauntMsg = "行不行啊，我阿公都比你快，遜咖";
    }

    if (tauntMsg) {
      state.timeTauntShown = true;
      showSnarkyMsg("時間警告！", tauntMsg, "我知道了啦！");
    }
  }

  // --- 結束判定 ---
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    renderTime(0);
    checkGameOver('time');
  } else {
    renderTime(state.timeLeft);
  }
}
function renderTime(secs) {
  const m = String(Math.floor(secs / 60)).padStart(2,'0');
  const s = String(secs % 60).padStart(2,'0');
  els.timer.textContent = `${m}:${s}`;
  els.timer.style.color = secs <= 60 ? 'var(--red)' : 'var(--paper)';
}

function updateStatusDefault() {
  els.status.textContent = state.notesMode ? '✦ 筆記模式開啟中 (1-9 填寫筆記)' : '點格子輸入，或按 Shift 鍵切換筆記模式';
  els.status.style.color = state.notesMode ? 'var(--note-color)' : '';
}
function flashStatus(msg, persistent=false) {
  els.status.textContent = msg;
  els.status.style.color = 'var(--gold-soft)';
  if (!persistent) setTimeout(updateStatusDefault, 1800);
}

// 事件綁定
document.querySelectorAll('.diff-buttons button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (btn.disabled) return; 
    document.querySelectorAll('.diff-buttons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    newGame(parseInt(btn.dataset.diff, 10));
  });
});

document.getElementById('btn-note').addEventListener('click', (e) => { e.stopPropagation(); toggleNotesMode(); });
document.getElementById('btn-hint').addEventListener('click', (e) => { e.stopPropagation(); giveHint(); });
document.getElementById('btn-erase').addEventListener('click', (e) => { e.stopPropagation(); eraseCell(); });
document.getElementById('btn-new').addEventListener('click', (e) => { e.stopPropagation(); newGame(); });

document.getElementById('btn-check').addEventListener('click', (e) => { 
  e.stopPropagation();
  if (!state.started || state.won || state.gameOver) return;
  
  let allCorrect = true;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = state.board[r][c];
      if (v !== 0 && v !== state.solution[r][c]) {
        getCellEl(r, c).classList.add('error');
        allCorrect = false;
      }
    }
  }
  flashStatus(allCorrect ? '目前為止都正確！繼續保持！' : '有格子填錯囉，已用紅色標出。', false);
});

// 嘲諷視窗關閉按鈕
els.snarkyClose.addEventListener('click', () => {
  els.snarkyOverlay.classList.remove('show');
});

// 過關/失敗視窗按鈕
document.getElementById('win-close').addEventListener('click', () => {
  const maxUnlockedBtn = Array.from(document.querySelectorAll('.diff-buttons button'))
                              .reverse().find(b => !b.disabled);
  if(maxUnlockedBtn) maxUnlockedBtn.click();
  else newGame();
});
document.getElementById('gameover-close').addEventListener('click', () => newGame());

// 隱藏輸入框事件 (手機虛擬鍵盤)
const mobileInput = document.getElementById('mobile-input');
mobileInput.addEventListener('input', (e) => {
  const val = e.target.value;
  if (val) {
    const num = parseInt(val.charAt(val.length - 1), 10);
    if (num >= 1 && num <= 9) {
      inputNumber(num);
    }
    mobileInput.value = ''; // 處理完立刻清空
  }
});

mobileInput.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
  }
});

// 桌面/實體鍵盤事件
document.addEventListener('keydown', (e) => {
  // 如果焦點在隱藏輸入框上，數字輸入交由 input 事件處理，避免重複輸入
  if (e.target.id === 'mobile-input' && e.key >= '1' && e.key <= '9') return;

  if (e.key === 'Shift') { toggleNotesMode(); return; }

  if (!state.selected || state.won || state.gameOver) return;
  let [r, c] = state.selected;

  if (e.key >= '1' && e.key <= '9') {
    inputNumber(parseInt(e.key, 10));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key === 'ArrowUp') r = (r - 1 + SIZE) % SIZE; 
    else if (e.key === 'ArrowDown') r = (r + 1) % SIZE;
    else if (e.key === 'ArrowLeft') c = (c - 1 + SIZE) % SIZE;
    else if (e.key === 'ArrowRight') c = (c + 1) % SIZE;
    selectCell(r, c);
  }
});

buildBoardDOM();
buildNumpad();
updateDiffButtons();
newGame(35); 
</script>
</body>
</html>
