<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數獨 Sudoku</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #14171f;
    --bg-soft: #1b1f2a;
    --bg-soft-2: #21273a;
    --paper: #fbf7ed;
    --paper-line: #e4dcc8;
    --ink: #23262b;
    --ink-soft: #6b6558;
    --gold: #d8a73d;
    --gold-soft: #e9c876;
    --teal: #2e8b84;
    --teal-soft: #7fc2bc;
    --red: #c1494d;
    --border-thick: #23262b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(216,167,61,0.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(46,139,132,0.09), transparent 50%);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    position: relative;
  }

  /* fine grain texture for a printed-plate feel */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.045;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 1;
  }

  /* registration-mark corners, quiet nod to a drafting sheet */
  .corner {
    position: fixed;
    width: 22px;
    height: 22px;
    border-color: rgba(216,167,61,0.35);
    pointer-events: none;
    z-index: 40;
  }
  .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 44px 20px 60px;
    position: relative;
    z-index: 2;
  }

  header {
    text-align: center;
    margin-bottom: 34px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 12px;
  }

  .eyebrow::before, .eyebrow::after {
    content: "—";
    color: rgba(233,200,118,0.4);
    margin: 0 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 54px;
    margin: 0;
    letter-spacing: 0.02em;
    color: var(--paper);
  }

  h1 .accent { color: var(--teal-soft); font-style: italic; font-weight: 600; }

  .subtitle {
    margin-top: 12px;
    font-size: 13px;
    color: #8b93a3;
    letter-spacing: 0.03em;
    transition: color 0.2s ease;
  }

  .layout {
    display: flex;
    gap: 36px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ---------- Board ---------- */
  .board-card {
    background: var(--paper);
    border-radius: 6px;
    padding: 22px;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
  }

  .board-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    pointer-events: none;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 44px);
    grid-template-rows: repeat(9, 44px);
    gap: 0;
    border: 2.5px solid var(--border-thick);
    background: var(--border-thick);
  }

  .cell {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 500;
    color: var(--teal);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: background 0.12s ease, box-shadow 0.12s ease;
  }

  .cell.given {
    color: var(--ink);
    font-weight: 600;
    cursor: default;
  }

  .cell:nth-child(3n) { border-right: 2px solid var(--border-thick); }
  .cell:nth-child(9n) { border-right: none; }
  #board .cell:nth-child(n+19):nth-child(-n+27),
  #board .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border-thick); }

  .cell:not(.given):not(.error):hover { background: #f1ead6; }

  .cell.selected { background: #f4e6b8; box-shadow: inset 0 0 0 2px var(--teal); }
  .cell.peer { background: #f7f1de; }
  .cell.same-value:not(.selected) { background: #ecdfae; }

  .cell.error { color: var(--red); background: #f6dede; }
  .cell.error.given { color: var(--red); }

  .cell.hint-fill { animation: pop 0.35s ease; }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------- Side panel ---------- */
  .panel {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel-block {
    background: linear-gradient(180deg, var(--bg-soft-2), var(--bg-soft));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 16px 18px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,0.7);
  }

  .panel-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 10px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Fraunces', serif;
  }

  .stat-row .value {
    font-size: 26px;
    font-weight: 600;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
  }

  .diff-buttons {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: var(--paper);
    padding: 9px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1;
  }

  button:hover { border-color: var(--gold); color: var(--gold-soft); }
  button:focus-visible { outline: 2px solid var(--teal-soft); outline-offset: 2px; }

  .diff-buttons button.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #23262b;
    font-weight: 600;
  }

  .action-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .action-buttons button { width: 100%; text-align: left; padding: 10px 12px; letter-spacing: 0.02em; }
  .action-buttons button .k { color: var(--teal-soft); margin-right: 6px; }

  .numpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .numpad button {
    padding: 10px 0;
    font-size: 16px;
    text-align: center;
    font-weight: 500;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #545b6b;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 2;
  }

  /* ---------- Win overlay ---------- */
  #win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,23,31,0.9);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #win-overlay.show { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: var(--paper);
    color: var(--ink);
    padding: 42px 52px;
    border-radius: 8px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.7);
    animation: popIn 0.3s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.94) translateY(6px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .win-card h2 {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    margin: 0 0 8px;
    color: var(--teal);
  }
  .win-card p { color: var(--ink-soft); font-size: 13px; margin-bottom: 22px; }
  .win-card button {
    background: var(--teal);
    color: var(--paper);
    border: none;
    padding: 11px 22px;
    font-weight: 600;
  }
  .win-card button:hover { background: #266f69; color: var(--paper); }

  @media (max-width: 720px) {
    .corner { display: none; }

    #board { grid-template-columns: repeat(9, 34px); grid-template-rows: repeat(9, 34px); }
    .cell { font-size: 16px; }
    .panel { width: 100%; max-width: 396px; }
    h1 { font-size: 38px; }

    /* numpad becomes the first block right under the board, and
       stays reachable near the thumb instead of drifting to the
       bottom of a long stacked page */
    .panel-block.numpad-block {
      order: -1;
      position: sticky;
      bottom: 12px;
      z-index: 30;
      background: rgba(27,31,42,0.94);
      backdrop-filter: blur(8px);
    }
    .numpad button {
      padding: 15px 0;
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cell.hint-fill, .shake, #win-overlay.show, .win-card { animation: none; }
  }
</style>
</head>
<body>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">終端機的紙本謎題 001</div>
    <h1>數<span class="accent">獨</span> Sudoku</h1>
    <div class="subtitle">點格子輸入，或用鍵盤數字鍵作答</div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div id="board"></div>
    </div>

    <div class="panel">
      <div class="panel-block numpad-block">
        <div class="panel-label">數字鍵盤</div>
        <div class="numpad" id="numpad"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">計時 / 錯誤</div>
        <div class="stat-row">
          <span class="value" id="timer">00:00</span>
          <span class="value" id="mistakes" style="color:var(--red); font-size:20px;">0 誤</span>
        </div>
      </div>

      <div class="panel-block">
        <div class="panel-label">難度</div>
        <div class="diff-buttons">
          <button data-diff="35" class="active">簡單</button>
          <button data-diff="45">中等</button>
          <button data-diff="55">困難</button>
        </div>
      </div>

      <div class="panel-block">
        <div class="panel-label">動作</div>
        <div class="action-buttons">
          <button id="btn-new"><span class="k">↻</span>新遊戲</button>
          <button id="btn-hint"><span class="k">?</span>提示一格</button>
          <button id="btn-check"><span class="k">✓</span>檢查盤面</button>
          <button id="btn-erase"><span class="k">⌫</span>清除格子</button>
        </div>
      </div>
    </div>
  </div>

  <footer>用滑鼠或觸控點格子選取，鍵盤 1-9 輸入，Delete / Backspace 清除</footer>
</div>

<div id="win-overlay">
  <div class="win-card">
    <h2>完成了！</h2>
    <p id="win-detail">恭喜解出這個數獨。</p>
    <button id="win-close">再玩一局</button>
  </div>
</div>

<script>
const SIZE = 9, BOX = 3;

/* ---------------- Sudoku engine ---------------- */
function emptyBoard() {
  return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
}

function isValid(board, row, col, num) {
  for (let i = 0; i < SIZE; i++) {
    if (board[row][i] === num || board[i][col] === num) return false;
  }
  const br = Math.floor(row / BOX) * BOX, bc = Math.floor(col / BOX) * BOX;
  for (let r = br; r < br + BOX; r++)
    for (let c = bc; c < bc + BOX; c++)
      if (board[r][c] === num) return false;
  return true;
}

function findEmpty(board) {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) return [r, c];
  return null;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function solve(board, randomize) {
  const empty = findEmpty(board);
  if (!empty) return true;
  const [row, col] = empty;
  let nums = [1,2,3,4,5,6,7,8,9];
  if (randomize) shuffle(nums);
  for (const num of nums) {
    if (isValid(board, row, col, num)) {
      board[row][col] = num;
      if (solve(board, randomize)) return true;
      board[row][col] = 0;
    }
  }
  return false;
}

function countSolutions(board, limit) {
  const empty = findEmpty(board);
  if (!empty) return 1;
  const [row, col] = empty;
  let count = 0;
  for (let num = 1; num <= 9; num++) {
    if (isValid(board, row, col, num)) {
      board[row][col] = num;
      count += countSolutions(board, limit);
      board[row][col] = 0;
      if (count >= limit) break;
    }
  }
  return count;
}

function cloneBoard(b) { return b.map(row => row.slice()); }

function generateFullBoard() {
  const board = emptyBoard();
  solve(board, true);
  return board;
}

function generatePuzzle(holes) {
  const solution = generateFullBoard();
  const puzzle = cloneBoard(solution);
  const cells = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) cells.push([r,c]);
  shuffle(cells);

  let removed = 0;
  for (const [r, c] of cells) {
    if (removed >= holes) break;
    const backup = puzzle[r][c];
    puzzle[r][c] = 0;
    const test = cloneBoard(puzzle);
    if (countSolutions(test, 2) !== 1) {
      puzzle[r][c] = backup;
    } else {
      removed++;
    }
  }
  return { puzzle, solution };
}

/* ---------------- Game state ---------------- */
let state = {
  puzzle: null,
  solution: null,
  board: null,
  selected: null,
  mistakes: 0,
  holes: 35,
  timerStart: null,
  timerInterval: null,
  started: false,
  won: false
};

const boardEl = document.getElementById('board');
const timerEl = document.getElementById('timer');
const mistakesEl = document.getElementById('mistakes');
const numpadEl = document.getElementById('numpad');
const winOverlay = document.getElementById('win-overlay');
const winDetail = document.getElementById('win-detail');

function buildBoardDOM() {
  boardEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', () => selectCell(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function buildNumpad() {
  numpadEl.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', () => inputNumber(n));
    numpadEl.appendChild(b);
  }
}

/* Timer only starts once the player makes their first move, not the
   moment the page loads. Everything before that first move reads 00:00. */
function startTimer() {
  clearInterval(state.timerInterval);
  state.timerStart = Date.now();
  state.timerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - state.timerStart) / 1000);
    const m = String(Math.floor(secs / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 500);
}

function ensureTimerStarted() {
  if (state.started) return;
  state.started = true;
  startTimer();
}

function newGame(holes) {
  state.holes = holes ?? state.holes;
  const { puzzle, solution } = generatePuzzle(state.holes);
  state.puzzle = puzzle;
  state.solution = solution;
  state.board = cloneBoard(puzzle);
  state.selected = null;
  state.mistakes = 0;
  state.won = false;
  state.started = false;
  clearInterval(state.timerInterval);
  timerEl.textContent = '00:00';
  mistakesEl.textContent = '0 誤';
  winOverlay.classList.remove('show');
  render();
}

function selectCell(r, c) {
  if (state.won) return;
  state.selected = [r, c];
  render();
}

function inputNumber(num) {
  if (state.won || !state.selected) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return; // given cell, locked

  ensureTimerStarted();

  state.board[r][c] = num;
  const cellEl = cellAt(r, c);

  if (num !== state.solution[r][c]) {
    state.mistakes++;
    mistakesEl.textContent = `${state.mistakes} 誤`;
    cellEl.classList.add('shake');
    setTimeout(() => cellEl.classList.remove('shake'), 350);
  } else {
    cellEl.classList.add('hint-fill');
    setTimeout(() => cellEl.classList.remove('hint-fill'), 350);
  }

  render();
  checkWin();
}

function eraseCell() {
  if (state.won || !state.selected) return;
  const [r, c] = state.selected;
  if (state.puzzle[r][c] !== 0) return;
  state.board[r][c] = 0;
  render();
}

function giveHint() {
  if (state.won) return;
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (state.board[r][c] === 0) empties.push([r, c]);
  if (empties.length === 0) return;

  ensureTimerStarted();

  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  state.board[r][c] = state.solution[r][c];
  state.selected = [r, c];
  render();
  const cellEl = cellAt(r, c);
  cellEl.classList.add('hint-fill');
  setTimeout(() => cellEl.classList.remove('hint-fill'), 350);
  checkWin();
}

function checkBoardCorrectness() {
  let allCorrect = true;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cellEl = cellAt(r, c);
      const v = state.board[r][c];
      if (v !== 0 && v !== state.solution[r][c]) {
        cellEl.classList.add('error');
        allCorrect = false;
      } else {
        cellEl.classList.remove('error');
      }
    }
  }
  return allCorrect;
}

function checkWin() {
  const filled = state.board.every(row => row.every(v => v !== 0));
  const correct = checkBoardCorrectness();
  if (filled && correct) {
    state.won = true;
    clearInterval(state.timerInterval);
    winDetail.textContent = `用時 ${timerEl.textContent}，錯誤 ${state.mistakes} 次。`;
    winOverlay.classList.add('show');
  }
}

function cellAt(r, c) {
  return boardEl.children[r * SIZE + c];
}

function render() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cellEl = cellAt(r, c);
      const v = state.board[r][c];
      cellEl.textContent = v === 0 ? '' : v;
      cellEl.classList.toggle('given', state.puzzle[r][c] !== 0);

      cellEl.classList.remove('selected', 'peer', 'same-value');

      if (state.selected) {
        const [sr, sc] = state.selected;
        const sameRow = r === sr, sameCol = c === sc;
        const sameBox = Math.floor(r/BOX) === Math.floor(sr/BOX) && Math.floor(c/BOX) === Math.floor(sc/BOX);
        if (r === sr && c === sc) {
          cellEl.classList.add('selected');
        } else if (sameRow || sameCol || sameBox) {
          cellEl.classList.add('peer');
        }
        const selVal = state.board[sr][sc];
        if (selVal !== 0 && v === selVal) cellEl.classList.add('same-value');
      }
    }
  }
  checkBoardCorrectness();
}

/* ---------------- Controls wiring ---------------- */
document.querySelectorAll('.diff-buttons button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-buttons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    newGame(parseInt(btn.dataset.diff, 10));
  });
});

document.getElementById('btn-new').addEventListener('click', () => newGame());
document.getElementById('btn-hint').addEventListener('click', giveHint);
document.getElementById('btn-check').addEventListener('click', () => {
  const ok = checkBoardCorrectness();
  const banner = ok ? '目前為止都正確！' : '有格子填錯囉，已用紅色標出。';
  flashMessage(banner);
});
document.getElementById('btn-erase').addEventListener('click', eraseCell);
document.getElementById('win-close').addEventListener('click', () => newGame());

function flashMessage(msg) {
  const sub = document.querySelector('.subtitle');
  const original = sub.textContent;
  sub.textContent = msg;
  sub.style.color = 'var(--gold-soft)';
  setTimeout(() => { sub.textContent = original; sub.style.color = ''; }, 1600);
}

document.addEventListener('keydown', (e) => {
  if (!state.selected) return;
  if (e.key >= '1' && e.key <= '9') {
    inputNumber(parseInt(e.key, 10));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
  } else if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    let [r, c] = state.selected;
    if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
    if (e.key === 'ArrowDown') r = Math.min(8, r + 1);
    if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
    if (e.key === 'ArrowRight') c = Math.min(8, c + 1);
    selectCell(r, c);
  }
});

/* ---------------- Init ---------------- */
buildBoardDOM();
buildNumpad();
newGame(35);
</script>
